
name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK directory not found."
            exit 1
          }

      - name: Install Android SDK components
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            >/dev/null

      - name: Validate Android Manifest XML
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("Manifest XML is valid.")
          except (ET.ParseError, OSError) as error:
              print(f"::error file={path}::Invalid manifest: {error}")
              sys.exit(1)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.logging.stacktrace=internal \
            2>&1 | tail -n 100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: israel-transit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
